<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Loading">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="0.5" stop-color="#555"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <circle cx="90" cy="90" r="58" fill="none" stroke="#ddd" stroke-width="5" opacity=".35"/>
  <circle cx="90" cy="90" r="58" fill="none" stroke="url(#g)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="95 270">
    <animateTransform attributeName="transform" type="rotate"
      from="0 90 90" to="360 90 90" dur="1.05s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="35" fill="none" stroke="#999" stroke-width="2" opacity=".22"
          stroke-dasharray="2 8">
    <animateTransform attributeName="transform" type="rotate"
      from="360 90 90" to="0 90 90" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="7" fill="#222" filter="url(#soft)">
    <animate attributeName="r" values="6;9;6" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
